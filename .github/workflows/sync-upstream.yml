name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixes branch
        uses: actions/checkout@v4
        with:
          ref: fixes/all-my-patches
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/koush/scrypted.git
          git fetch upstream main --no-tags

      - name: Check if branch is behind upstream
        id: check
        run: |
          BEHIND=$(git log --oneline HEAD..upstream/main | wc -l | tr -d ' ')
          AHEAD=$(git log --oneline upstream/main..HEAD | wc -l | tr -d ' ')
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "fixes/all-my-patches is $AHEAD ahead, $BEHIND behind upstream/main"

      - name: Rebase onto upstream/main
        if: steps.check.outputs.behind != '0'
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rebase upstream/main && echo "rebase_ok=true" >> $GITHUB_OUTPUT || echo "rebase_ok=false" >> $GITHUB_OUTPUT

      - name: Push rebased branch
        if: steps.check.outputs.behind != '0' && steps.rebase.outputs.rebase_ok == 'true'
        run: |
          git push origin fixes/all-my-patches --force-with-lease
          echo "✅ Rebased and pushed successfully"

      - name: Open issue on conflict
        if: steps.check.outputs.behind != '0' && steps.rebase.outputs.rebase_ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.check.outputs.behind }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ fixes/all-my-patches needs manual rebase (${behind} commits behind upstream)`,
              body: [
                '## Automatic rebase failed',
                '',
                `The \`fixes/all-my-patches\` branch is **${behind} commits behind** \`koush/scrypted:main\` and has a conflict that needs manual resolution.`,
                '',
                '### To fix:',
                '```bash',
                'cd /root/scrypted/fork',
                'git fetch upstream',
                'git rebase upstream/main',
                '# resolve conflicts, then:',
                'git rebase --continue',
                'git push origin fixes/all-my-patches --force-with-lease',
                '```',
                '',
                '### After rebasing, verify patches still apply:',
                '```bash',
                'python3 patches/nvr/patch-nvr.py --check',
                '```',
              ].join('\n'),
              labels: ['rebase-needed'],
            });
